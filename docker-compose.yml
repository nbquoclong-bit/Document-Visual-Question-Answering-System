services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docvqa-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////app/db/app.db
      - MODEL_DIR=/app/model
      - VLM_ADAPTER_PATH=/app/model/stage1_vlm/output/lora_adapters
    volumes:
      - backend-uploads:/app/uploads
      - backend-results:/app/results
      - backend-db:/app/db
      - ./model:/app/model:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docvqa-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  backend-uploads:
  backend-results:
  backend-db:
