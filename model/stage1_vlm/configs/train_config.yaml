model_name: Qwen/Qwen2-VL-2B-Instruct
output_dir: ./stage1_vlm/output
max_seq_length: 2048
max_steps: 400
batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5e-5
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
data:
  train_data_path: data/vlm_train.json

