model_name: Qwen/Qwen2-VL-2B-Instruct
output_dir: ./stage1_vlm/output
max_seq_length: 2048
max_steps: 400
num_train_epochs: 3
batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1e-4
warmup_ratio: 0.1
weight_decay: 0.01
lr_scheduler_type: cosine
gradient_checkpointing: true
fp16: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_data_path: data/vlm_train.json
  val_data_path: data/vlm_test.json
  min_pixels: 200704    # 256 * 28 * 28
  max_pixels: 602112    # 768 * 28 * 28
