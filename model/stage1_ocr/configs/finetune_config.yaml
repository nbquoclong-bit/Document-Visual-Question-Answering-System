# Stage 1 - PaddleOCR Fine-tuning for Vietnamese Invoices
# Training hyperparameters
training:
  max_epochs: 50
  batch_size: 8
  learning_rate: 0.0001
  save_epoch: 5
  early_stopping_patience: 10

model:
  base_model: PaddleOCR (chinese + english pretrained)
  lang: vi  # Vietnamese

augmentation:
  rotation_range: 5
  noise_std: 15
  blur_prob: 0.3

data:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  # MC_OCR 2021 dataset path (user must download)
  mc_ocr_path: ./data/mcocr_public/
  internal_data_path: ./data/internal_invoices/
  output_dir: ./output/
