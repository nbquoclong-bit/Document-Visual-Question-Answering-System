<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sổ Hoá Đơn — Document VQA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN (Play CDN) — không cần bước build riêng cho Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Cấu hình theme tuỳ biến — PHẢI đặt SAU thẻ script cdn.tailwindcss.com ở trên
      // để Tailwind đọc được config này trước khi xử lý class trong DOM.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: "#efeae0",
              "paper-raised": "#fffdf8",
              ink: "#22283b",
              "ink-soft": "#5a5f74",
              line: "#cfc6b0",
              stamp: "#a83f32",
              ledger: "#35695a",
              warn: "#a3762a",
            },
            fontFamily: {
              display: ["Fraunces", "Georgia", "serif"],
              sans: ["Inter", "-apple-system", "sans-serif"],
              mono: ["IBM Plex Mono", "SFMono-Regular", "monospace"],
            },
            keyframes: {
              "stamp-in": {
                "0%": { transform: "scale(1.4) rotate(-3deg)", opacity: 0 },
                "100%": { transform: "scale(1) rotate(0deg)", opacity: 1 },
              },
              "pulse-soft": {
                "0%, 100%": { opacity: 1 },
                "50%": { opacity: 0.25 },
              },
            },
            animation: {
              "stamp-in": "stamp-in 0.28s cubic-bezier(0.34,1.56,0.64,1)",
              "pulse-soft": "pulse-soft 1.1s ease-in-out infinite",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-paper text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
